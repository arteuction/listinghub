deptrac:
  paths:
    - app

  layers:
    - name: Controllers
      collectors:
        - type: directory
          value: app/Http/Controllers/.*

    - name: Requests
      collectors:
        - type: directory
          value: app/Http/Requests/.*

    - name: Actions
      collectors:
        - type: directory
          value: app/Actions/.*

    - name: Services
      collectors:
        - type: directory
          value: app/Services/.*

    - name: Models
      collectors:
        - type: directory
          value: app/Models/.*

    - name: Enums
      collectors:
        - type: directory
          value: app/Enums/.*

    - name: Support
      collectors:
        - type: directory
          value: app/Support/.*

    - name: Policies
      collectors:
        - type: directory
          value: app/Policies/.*

    - name: Middleware
      collectors:
        - type: directory
          value: app/Http/Middleware/.*

    - name: Providers
      collectors:
        - type: directory
          value: app/Providers/.*

    - name: Exceptions
      collectors:
        - type: directory
          value: app/Exceptions/.*

  ruleset:
    Controllers:
      - Requests
      - Actions
      - Services
      - Models
      - Enums
      - Support
      - Exceptions

    Requests:
      - Enums
      - Support
      - Exceptions

    Actions:
      - Models
      - Enums
      - Support
      - Services
      - Exceptions

    Services:
      - Models
      - Enums
      - Support
      - Exceptions

    Policies:
      - Models
      - Enums

    Middleware:
      - Models
      - Enums
      - Support
      - Services

    Providers:
      - Models
      - Enums
      - Support
      - Services
      - Policies

    Models:
      - Enums
      - Support

    Enums: []

    Support:
      - Enums
      - Exceptions

    Exceptions: []

  skip_violations: {}
