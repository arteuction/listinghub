name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build without creating a GitHub release'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build deploy archive
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, openssl, tokenizer, ctype, json, curl, fileinfo, gd, intl, dom, libxml, xmlreader, exif, zip, zlib

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Composer (no-dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build Vite assets
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Bundle size check
        run: node scripts/check-bundle-size.mjs

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep -oP "(?<='version' => ')[^']+" config/listinghub.php)
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "commit_short=${COMMIT_SHORT}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}, Commit: ${COMMIT_SHORT}"

      - name: Generate BUILD.json
        run: |
          cat > BUILD.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "commit": "${{ steps.version.outputs.commit }}",
            "commit_short": "${{ steps.version.outputs.commit_short }}",
            "branch": "${{ github.ref_name }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "php_min": "8.3.0",
            "laravel": "13.x"
          }
          EOF

      - name: Generate THIRD_PARTY_LICENSES.txt
        run: |
          echo "THIRD_PARTY_LICENSES" > THIRD_PARTY_LICENSES.txt
          echo "=====================" >> THIRD_PARTY_LICENSES.txt
          echo "" >> THIRD_PARTY_LICENSES.txt
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> THIRD_PARTY_LICENSES.txt
          echo "ListingHub v${{ steps.version.outputs.version }}" >> THIRD_PARTY_LICENSES.txt
          echo "" >> THIRD_PARTY_LICENSES.txt
          echo "== Composer packages ==" >> THIRD_PARTY_LICENSES.txt
          echo "" >> THIRD_PARTY_LICENSES.txt
          php -r '
            $installed = json_decode(file_get_contents("vendor/composer/installed.json"), true);
            $packages = $installed["packages"] ?? $installed;
            usort($packages, fn($a, $b) => strcmp($a["name"], $b["name"]));
            foreach ($packages as $p) {
                $name = $p["name"];
                $version = $p["version"] ?? "unknown";
                $license = implode(", ", $p["license"] ?? ["unknown"]);
                echo "{$name} ({$version}) — {$license}\n";
            }
          ' >> THIRD_PARTY_LICENSES.txt
          echo "" >> THIRD_PARTY_LICENSES.txt
          echo "== NPM packages (build-time, bundled output only) ==" >> THIRD_PARTY_LICENSES.txt
          echo "" >> THIRD_PARTY_LICENSES.txt
          node -e '
            const pkg = require("./package.json");
            const deps = { ...pkg.dependencies };
            for (const [name, version] of Object.entries(deps).sort()) {
              let license = "unknown";
              try {
                const p = require(`./node_modules/${name}/package.json`);
                license = p.license || "unknown";
              } catch {}
              console.log(`${name} (${version}) — ${license}`);
            }
          ' >> THIRD_PARTY_LICENSES.txt

      - name: Assemble deploy directory
        run: |
          WRAPPER="listinghub-${{ steps.version.outputs.version }}"
          STAGING="/tmp/${WRAPPER}"
          mkdir -p "${STAGING}"

          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.backup' \
            --exclude='.env.production' \
            --exclude='database/database.sqlite' \
            --exclude='storage/app/installed.lock' \
            --exclude='storage/app/installation.running' \
            --exclude='storage/app/installation.pending' \
            --exclude='storage/app/purifier' \
            --exclude='storage/logs/*.log' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/views/*.php' \
            --exclude='phpstan.neon' \
            --exclude='phpstan-baseline.neon' \
            --exclude='deptrac.yaml' \
            --exclude='pint.json' \
            --exclude='phpunit.xml' \
            --exclude='vite.config.js' \
            --exclude='tailwind.config.js' \
            --exclude='postcss.config.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='playwright.config.ts' \
            --exclude='lefthook.yml' \
            --exclude='lighthouserc.json' \
            --exclude='renovate.json' \
            --exclude='scripts/build-deploy.ps1' \
            --exclude='scripts/check-bundle-size.mjs' \
            --exclude='backups/' \
            --exclude='resources/js/' \
            --exclude='resources/css/' \
            ./ "${STAGING}/"

          # Ensure writable dirs with .gitkeep
          for dir in storage/app storage/app/public storage/framework/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache; do
            mkdir -p "${STAGING}/${dir}"
            touch "${STAGING}/${dir}/.gitkeep"
          done

          # Make shell scripts executable
          chmod +x "${STAGING}/install.sh" "${STAGING}/verify.sh" "${STAGING}/upgrade.sh"

          echo "STAGING=${STAGING}" >> "$GITHUB_ENV"
          echo "WRAPPER=${WRAPPER}" >> "$GITHUB_ENV"

      - name: Normalize ownership and timestamps
        run: |
          COMMIT_DATE=$(git log -1 --format=%cI)
          find "${STAGING}" -exec touch -d "${COMMIT_DATE}" {} +

      - name: Create tar.gz
        run: |
          cd /tmp
          tar czf "/tmp/${WRAPPER}.tar.gz" \
            --owner=0 --group=0 \
            --sort=name \
            "${WRAPPER}"

      - name: Create ZIP
        run: |
          cd /tmp
          zip -r -X "/tmp/${WRAPPER}.zip" "${WRAPPER}"

      - name: Generate SHA256SUMS
        id: checksums
        run: |
          cd /tmp
          sha256sum "${WRAPPER}.tar.gz" "${WRAPPER}.zip" > SHA256SUMS
          cat SHA256SUMS
          echo "tarball=${WRAPPER}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "zipball=${WRAPPER}.zip" >> "$GITHUB_OUTPUT"

      - name: Verify package integrity
        run: |
          cd /tmp
          mkdir -p verify-test
          tar xzf "${WRAPPER}.tar.gz" -C verify-test
          cd "verify-test/${WRAPPER}"
          # Structural checks only (no PHP runtime in extracted dir)
          test -f artisan
          test -f .env.example
          test ! -f .env
          test -d vendor
          test -d public/build
          test -f BUILD.json
          test ! -d .git
          test ! -d node_modules
          test ! -d tests
          test -f install.sh
          test -f verify.sh
          test -f upgrade.sh
          test -f THIRD_PARTY_LICENSES.txt
          echo "Package structural verification passed."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-archives
          path: |
            /tmp/${{ env.WRAPPER }}.tar.gz
            /tmp/${{ env.WRAPPER }}.zip
            /tmp/SHA256SUMS

      - name: Attest provenance
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            /tmp/${{ env.WRAPPER }}.tar.gz
            /tmp/${{ env.WRAPPER }}.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/${{ env.WRAPPER }}.tar.gz
            /tmp/${{ env.WRAPPER }}.zip
            /tmp/SHA256SUMS
          generate_release_notes: true
