name: Browser Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright · axe
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: listinghub_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: listinghub_e2e
      DB_USERNAME: root
      DB_PASSWORD: root
      # The database driver needs its tables, which exist only after migrate;
      # file/array keep the very first requests working regardless.
      SESSION_DRIVER: file
      CACHE_STORE: file
      # Registration fires Registered, whose verification mail is sent inline.
      # With the .env.example default (smtp -> 127.0.0.1:2525) nothing is
      # listening on the runner, so POST /register throws a transport exception
      # and renders the error page instead of redirecting. `log` keeps the mail
      # path exercised end to end without needing a mail server.
      MAIL_MAILER: log

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, mbstring, json, xml, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS dependencies
        run: npm ci

      # The layout uses @vite, so without a build every page 500s. This is
      # precisely the failure mode the browser gate exists to catch, which is
      # why the assets are built rather than stubbed.
      - name: Build assets
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force
          php artisan storage:link
          # EnsureInstalled redirects every request to the installer until this
          # lock exists; without it the whole suite would test the wizard.
          mkdir -p storage/app
          touch storage/app/installed.lock

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: storage/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: listinghub_lh
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: listinghub_lh
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: file
      CACHE_STORE: file
      MAIL_MAILER: log

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, mbstring, json, xml, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci
          npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force
          mkdir -p storage/app
          touch storage/app/installed.lock

      - name: Serve
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      - name: Wait for the server
        run: npx wait-on http://127.0.0.1:8000 --timeout 60000

      # Accessibility and SEO are asserted; PERFORMANCE IS OFF ON PURPOSE.
      # A shared CI runner's timing variance makes a performance score a coin
      # flip, and a gate that fails at random is a gate people learn to ignore.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: storage/lighthouse
          retention-days: 7
