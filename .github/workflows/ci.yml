name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-analyse:
    name: Pint · Larastan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, mbstring, json, xml, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # -v prints the diff for every offending file, so a failing run says
      # exactly what to change instead of only naming the rules.
      - name: Laravel Pint (code style)
        run: vendor/bin/pint --test -v

      - name: Larastan (static analysis)
        run: vendor/bin/phpstan analyse --memory-limit=512M

  frontend:
    name: Vite build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` fails outright if package.json and package-lock.json disagree,
      # which is what makes the asset build reproducible.
      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

  bg-datasets:
    name: BG dataset validation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Offline, stdlib-only. Blocks a geo update that breaks an EKATTE code,
      # duplicates an identifier, or mismatches a municipality link.
      - name: Validate committed BG datasets
        run: |
          python3 scripts/validate_bg_datasets.py \
            --geo database/data/bg-geo.json \
            --population database/data/bg-population/grao-2026-06-15.json

  secrets-scan:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests-sqlite:
    name: Pest · SQLite (sequential)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_sqlite, mbstring, json, xml, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Pest (SQLite, sequential)
        run: vendor/bin/pest
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

  tests:
    name: Pest · MySQL 8
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: listinghub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, mbstring, json, xml, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: listinghub_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: listinghub_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run Pest
        run: vendor/bin/pest
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: listinghub_test
          DB_USERNAME: root
          DB_PASSWORD: root
