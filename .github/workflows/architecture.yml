name: Architecture Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  deptrac:
    name: Deptrac (layer boundaries)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, mbstring, json, xml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # No --fail-on-uncovered: the layers describe app/ only, so every
      # Illuminate\*, Spatie\* and Database\Seeders\* reference counts as
      # "uncovered". Modelling the framework to silence that adds no
      # architectural value — the ruleset below is what guards the boundaries,
      # and it fails the build on any real violation between our own layers.
      - name: Deptrac analyse
        run: vendor/bin/deptrac analyse --no-cache

  doc-status:
    name: Documentation completeness
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: bash check-doc-status.sh
