name: Architecture Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  deptrac:
    name: Deptrac (layer boundaries)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, mbstring, json, xml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # --report-uncovered names the classes that sit outside every layer;
      # without it a --fail-on-uncovered failure prints nothing actionable.
      - name: Deptrac analyse
        run: vendor/bin/deptrac analyse --no-cache --fail-on-uncovered --report-uncovered

  doc-status:
    name: Documentation completeness
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: bash check-doc-status.sh
